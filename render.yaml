services:
  - type: web
    name: language-tutor-bot
    runtime: python3
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: TELEGRAM_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: PORT
        fromService:
          type: web
          name: language-tutor-bot
          property: port
    healthCheckPath: /health
    plan: starter